<div class="base">

  <div class="time">
    <div class="hour-block">
      <div id="hour"></div>
      <div class="label">h</div>
    </div>
    <div class="minute-block">
      <div id="minute"></div>
      <div class="label">m</div>
    </div>
    <div class="second-block">
      <div id="second"></div>
      <div class="label">s</div>
    </div>
  </div>

  <div id="progress">
    <div id="progress-done"></div>
  </div>

  <div id="status"></div>

  <div>
    <ui-button id="pause-resume">Pause</ui-button>
    <ui-button id="reset">Reset</ui-button>
  </div>

</div>
